name: Publish verified installers

on:
  workflow_dispatch:
    inputs:
      windows_run:
        description: Successful Windows build run ID
        required: true
        type: string
      linux_run:
        description: Successful Linux build run ID
        required: true
        type: string
      macos_run:
        description: Successful Apple Silicon build run ID
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      WINDOWS_RUN: ${{ inputs.windows_run }}
      LINUX_RUN: ${{ inputs.linux_run }}
      MACOS_RUN: ${{ inputs.macos_run }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require passing jobs and identical application source
        run: python scripts/verify-release-runs.py
      - uses: actions/download-artifact@v4
        with:
          name: installers-windows-x64
          run-id: ${{ inputs.windows_run }}
          github-token: ${{ github.token }}
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: installers-linux-x64
          run-id: ${{ inputs.linux_run }}
          github-token: ${{ github.token }}
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: installers-macos-arm64
          run-id: ${{ inputs.macos_run }}
          github-token: ${{ github.token }}
          path: release-assets
      - name: Verify installer hashes and release version
        run: |
          python scripts/verify-release-artifacts.py release-assets
          python scripts/release-notes.py "$RELEASE_TAG" > release-notes.md
      - name: Publish
        run: gh release create "$RELEASE_TAG" --verify-tag --title "Sortly $RELEASE_TAG" --notes-file release-notes.md release-assets/*
